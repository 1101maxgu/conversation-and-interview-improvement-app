name: CI

on:
  push:
  pull_request:

# A newer push to the same branch cancels the run it replaces.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run test
      # No secrets: the build must pass with no environment variables set.
      # `npm run smoke` and `npm run eval` need a running server and live keys, so they stay manual.
      - run: npm run build
